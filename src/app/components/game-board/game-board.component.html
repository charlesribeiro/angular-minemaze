<div
  class="board-grid"
  [style.gridTemplateColumns]="'repeat(' + columns + ', 1fr)'"
>
  @for (cell of board(); track cell.id) {

  <!-- {{ cell.row }} {{ cell.col }} -->
  <app-cell
    [row]="cell.row"
    [col]="cell.col"
    [isRevealed]="cell.isRevealed"
    [isMine]="cell.isMine"
    [isFlagged]="cell.isFlagged"
    (click)="onCellClick(cell.row, cell.col)"
    [class.active]="isActiveCell(cell.row, cell.col)"
  />
  }
</div>
